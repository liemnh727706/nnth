name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd /opt/nnth

            echo "==> Pull latest code"
            git pull origin main

            echo "==> Tạo .env nếu chưa có"
            if [ ! -f server/.env ]; then
              cp server/.env.example server/.env
              echo "⚠ server/.env chưa có — đã copy từ example. Cần điền credentials thực."
            fi

            echo "==> Build & restart containers"
            docker compose build --no-cache server client
            docker compose up -d --remove-orphans postgres server client

            echo "==> Chờ DB sẵn sàng"
            sleep 12

            echo "==> Run DB migrations"
            docker compose exec -T server node database/migrate.js || true

            echo "==> Health check"
            sleep 3
            curl -f http://localhost:5000/api/health || exit 1

            echo "==> Done ✓"
