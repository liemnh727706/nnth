services:
  postgres:
    image: postgres:16-alpine
    container_name: nnth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nnth_hcmuaf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nnth_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./server/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
      - ./database:/app/database:ro
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nnth_client
    restart: unless-stopped
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    container_name: nnth_nginx
    restart: unless-stopped
    depends_on:
      - server
      - client
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/var/www/uploads:ro
      - certbot_www:/var/www/certbot:ro

volumes:
  postgres_data:
  uploads:
  logs:
  certbot_www:
